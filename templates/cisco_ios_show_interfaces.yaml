metadata:
  description: "Parse output of 'show interfaces' command"
  compatibility: "Cisco IOS 12.x, 15.x"
  version: "1.0.0"
  author: "cliscrape"

version: 1
claims_schema: interface

fields:
  interface:
    type: string
    common_schema: name
  status:
    type: string
    common_schema: admin_status
  protocol:
    type: string
    common_schema: protocol_status
  description:
    type: string
    common_schema: description
  mtu:
    type: int
    common_schema: mtu
  bandwidth:
    type: int
    common_schema: bandwidth_kbps

states:
  Start:
    - regex: '^(?P<interface>\S+) is (?P<status>[^,]+),.*protocol is (?P<protocol>\S+)(?:\s*\(.*\))?$'
      action:
        line: next
    - regex: '^\s+Description: (?P<description>.+)$'
      action:
        line: next
    - regex: '^\s+MTU (?P<mtu>\d+) bytes, BW (?P<bandwidth>\d+) Kbit'
      action:
        line: next
    - regex: '^$'
      action:
        record: record
