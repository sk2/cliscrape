metadata:
  description: "Parse output of 'show version' command"
  compatibility: "Arista EOS 4.x+"
  version: "1.0.0"
  author: "cliscrape"

version: 1
claims_schema: version

fields:
  version:
    type: string
    common_schema: version
  model:
    type: string
    common_schema: model
  serial:
    type: string
    common_schema: serial
  uptime:
    type: string
    common_schema: uptime
  # Arista's `show version` body does not print hostname; the schema's
  # `hostname` key is optional and intentionally not mapped here. Operators
  # who need hostname should pair this with `show hostname` or capture it
  # from the prompt line preceding the command.

patterns:
  - regex: '^Arista (?P<model>\S+)$'
  - regex: '^\s*Software image version:\s+(?P<version>\S+)$'
  - regex: '^\s*System MAC address:\s+\S+\s+Serial number:\s+(?P<serial>\S+)$'
  - regex: '^\s*(?:Uptime:\s+|System uptime is )(?P<uptime>.+)$'
