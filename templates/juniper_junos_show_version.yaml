metadata:
  description: "Parse output of 'show version' command"
  compatibility: "Junos OS 12.x+"
  version: "1.0.0"
  author: "cliscrape"

version: 1
claims_schema: version

fields:
  hostname:
    type: string
    common_schema: hostname
  model:
    type: string
    common_schema: model
  junos_version:
    type: string
    common_schema: version
  serial:
    type: string
    common_schema: serial

patterns:
  - regex: '^Hostname:\s+(?P<hostname>\S+)$'
  - regex: '^Model:\s+(?P<model>.+)$'
  - regex: '^JUNOS.*\[(?P<junos_version>[^\]]+)\]'
  - regex: '^Chassis.*:\s+(?P<serial>\S+)$'
