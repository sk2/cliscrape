metadata:
  description: "Parse output of 'show version' command"
  compatibility: "Cisco NX-OS 7.x, 9.x"
  version: "1.0.0"
  author: "cliscrape"

version: 1
claims_schema: version

fields:
  version:
    type: string
    common_schema: version
  uptime:
    type: string
    common_schema: uptime
  hostname:
    type: string
    common_schema: hostname
  serial:
    type: string
    common_schema: serial
  model:
    type: string
    common_schema: model

patterns:
  - regex: '^\s+NXOS:\s+version\s+(?P<version>\S+)$'
  - regex: '^\s+cisco\s+(?P<model>\S+\s+\S+)\s+Chassis'
  - regex: '^\s+Device name:\s+(?P<hostname>\S+)$'
  - regex: '^\s+Processor Board ID\s+(?P<serial>\S+)$'
  - regex: '^.+uptime is (?P<uptime>.+)$'
