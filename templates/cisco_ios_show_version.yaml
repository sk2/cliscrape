metadata:
  description: "Parse output of 'show version' command"
  compatibility: "Cisco IOS 12.x, 15.x, IOS-XE"
  version: "1.0.0"
  author: "cliscrape"

version: 1
claims_schema: version

fields:
  version:
    type: string
    common_schema: version
  uptime:
    type: string
    common_schema: uptime
  hostname:
    type: string
    common_schema: hostname
  serial:
    type: string
    common_schema: serial
  model:
    type: string
    common_schema: model

patterns:
  - regex: '^(?P<hostname>\S+) uptime is (?P<uptime>.+)$'
  - regex: '^Cisco IOS Software,.+Version (?P<version>\S+)'
  - regex: '^\s*(?:Processor board ID|System serial number)\s+(?P<serial>\S+)'
  - regex: '^cisco (?P<model>\S+).+processor'
